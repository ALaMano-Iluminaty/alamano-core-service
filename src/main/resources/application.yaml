server:
  port: 8082
spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:alamano_core}
    username: ${POSTGRES_USER:core}
    password: ${POSTGRES_PASSWORD:core}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
alamano:
  nearby:
    # HU-Q9: vigencia (segundos) de la lista de barberos cercanos guardada en Redis por celda.
    cache-ttl-seconds: ${NEARBY_CACHE_TTL_SECONDS:10}
  tracking:
    average-speed-kmh: ${TRACKING_AVERAGE_SPEED_KMH:25}
  events:
    exchange: alamano.events
  security:
    jwt-public-key: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public.pem}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    # Tags que el tablero de Grafana usa para filtrar por servicio e instancia.
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:local}
    distribution:
      # Habilita el buckets de percentiles en http_server_requests_seconds, que
      # es lo que necesita histogram_quantile(0.95, ...) del tablero tecnico.
      percentiles-histogram:
        http.server.requests: true
logging:
  structured:
    format:
      console: ecs
