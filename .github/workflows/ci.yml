name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y pruebas
        run: ./mvnw -B verify

      - name: Guardar los reportes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-prueba
          path: target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Publicar imagen
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y la organizacion tiene mayusculas.
      - name: Nombre de la imagen en minuscula
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
