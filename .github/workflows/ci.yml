name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y pruebas
        run: ./mvnw -B verify

      - name: Guardar los reportes de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-prueba
          path: target/surefire-reports/
          if-no-files-found: ignore

  image:
    name: Publicar imagen
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR solo acepta nombres en minuscula y la organizacion tiene mayusculas.
      - name: Nombre de la imagen en minuscula
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> $GITHUB_ENV
        env:
          REPO: ${{ github.repository }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
  deploy:
    name: Desplegar en la VM
    needs: image
    if: github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Un deploy a la vez: dos merges seguidos no se pisan.
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    steps:
      - name: Preparar SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # La VM ignora el argumento: esta llave solo puede correr deploy.sh.
      - name: Desplegar
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" deploy
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}